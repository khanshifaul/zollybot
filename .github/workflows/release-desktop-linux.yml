name: Release Desktop Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to (defaults to the release event tag)
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-desktop-linux-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

jobs:
  ci-gate:
    name: Require green CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a successful CI run
        uses: ./.github/actions/require-green-ci

  meta:
    name: Resolve release metadata
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          pkg_version="$(bun -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
          echo "Package version: $pkg_version"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" --title "${RELEASE_TAG}" --notes "Automated release ${RELEASE_TAG}" --verify-tag
          fi

  desktop-linux-x64:
    name: Desktop Linux x64
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl git python3 python3-jinja2 python3-setuptools \
            clang libclang-dev gcc-14 g++-14 \
            libcap-dev libcurl4-openssl-dev libdrm-dev libevdev-dev libgbm-dev libminiupnpc-dev libnuma-dev \
            libopus-dev libpulse-dev libssl-dev libsystemd-dev libudev-dev libva-dev libwayland-dev \
            libx11-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb1-dev libxfixes-dev libxrandr-dev libxtst-dev \
            rpm libarchive-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build Linux x64 distributables
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CC: gcc-14
          CXX: g++-14
          CMAKE_GENERATOR: Ninja
        shell: bash
        run: |
          set -euo pipefail
          bun run dist:linux

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for f in out/desktop/dist/*.AppImage out/desktop/dist/*.deb out/desktop/dist/*.rpm out/desktop/dist/*.pacman \
                   out/desktop/dist/*.snap out/desktop/dist/latest-linux.yml out/desktop/dist/*.blockmap; do
            [ -e "$f" ] && cp "$f" release-assets/
          done
          (cd release-assets && sha256sum * > SHA256SUMS-linux-x64.txt) || true
          ls -la release-assets || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then echo "No Linux x64 artifacts found"; exit 1; fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  desktop-linux-arm64:
    name: Desktop Linux arm64
    needs: meta
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl git python3 \
            clang libclang-dev \
            libcap-dev libcurl4-openssl-dev libdrm-dev libevdev-dev libgbm-dev libminiupnpc-dev libnuma-dev \
            libopus-dev libpulse-dev libssl-dev libsystemd-dev libudev-dev libva-dev libwayland-dev \
            libx11-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb1-dev libxfixes-dev libxrandr-dev libxtst-dev \
            rpm libarchive-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build Linux arm64 distributables
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMAKE_GENERATOR: Ninja
        shell: bash
        run: |
          set -euo pipefail
          bun run dist:linux:arm64

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for f in out/desktop/dist/*.AppImage out/desktop/dist/*.deb out/desktop/dist/*.rpm out/desktop/dist/*.pacman \
                   out/desktop/dist/latest-linux-arm64.yml out/desktop/dist/*.blockmap; do
            [ -e "$f" ] && cp "$f" release-assets/
          done
          (cd release-assets && sha256sum * > SHA256SUMS-linux-arm64.txt) || true
          ls -la release-assets || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then echo "No Linux arm64 artifacts found"; exit 1; fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
