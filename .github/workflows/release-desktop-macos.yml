name: Release Desktop macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to (defaults to the release event tag)
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-desktop-macos-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

jobs:
  ci-gate:
    name: Require green CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a successful CI run
        uses: ./.github/actions/require-green-ci

  meta:
    name: Resolve release metadata
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          pkg_version="$(bun -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
          echo "Package version: $pkg_version"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" --title "${RELEASE_TAG}" --notes "Automated release ${RELEASE_TAG}" --verify-tag
          fi

  desktop-macos-arm64:
    name: Desktop macOS arm64
    needs: meta
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false

      - name: Install macOS build dependencies
        shell: bash
        run: |
          brew update
          brew install cmake ninja pkg-config openssl@3 opus boost miniupnpc || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build macOS arm64 distributables
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set -uo pipefail
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$(brew --prefix openssl@3):${CMAKE_PREFIX_PATH:-}"
          if ! bun run dist:mac; then
            echo "::warning::dist:mac with remote desktop runtime failed. Retrying without remote desktop runtime..."
            export ZOLLYBOT_SKIP_REMOTE_DESKTOP_RUNTIME=1
            unset ZOLLYBOT_ALLOW_RUNTIME_SOURCE_BUILD
            set -euo pipefail
            arch="$(uname -m | sed 's/arm64/arm64/; s/x86_64/x64/')"
            bun run voice:prepare-runtime
            bun scripts/prepare-remote-desktop-runtime.ts darwin "$arch"
            bun run verify:remote-desktop-runtime
            bun scripts/install-cua-driver.ts darwin "$arch"
            bun run build
            bunx electron-builder --mac --config.mac.identity=null --config.mac.notarize=false --config apps/desktop/electron-builder.yml
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for f in out/desktop/dist/*.dmg out/desktop/dist/*.zip out/desktop/dist/*.pkg \
                   out/desktop/dist/latest-mac.yml out/desktop/dist/*.blockmap; do
            [ -e "$f" ] && cp "$f" release-assets/
          done
          # Avoid clobbering arm64 manifest name; keep arch-specific copy.
          if [ -f release-assets/latest-mac.yml ]; then mv release-assets/latest-mac.yml release-assets/latest-mac-arm64.yml; fi
          (cd release-assets && shasum -a 256 * > SHA256SUMS-macos-arm64.txt) || true
          ls -la release-assets || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then echo "No macOS arm64 artifacts found"; exit 1; fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  desktop-macos-x64:
    name: Desktop macOS x64
    needs: meta
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false

      - name: Install macOS build dependencies
        shell: bash
        run: |
          brew update
          brew install cmake ninja pkg-config openssl@3 opus boost miniupnpc || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build macOS x64 distributables
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set -uo pipefail
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="$(brew --prefix openssl@3):${CMAKE_PREFIX_PATH:-}"
          if ! bun run dist:mac; then
            echo "::warning::dist:mac with remote desktop runtime failed. Retrying without remote desktop runtime..."
            export ZOLLYBOT_SKIP_REMOTE_DESKTOP_RUNTIME=1
            unset ZOLLYBOT_ALLOW_RUNTIME_SOURCE_BUILD
            set -euo pipefail
            arch="$(uname -m | sed 's/arm64/arm64/; s/x86_64/x64/')"
            bun run voice:prepare-runtime
            bun scripts/prepare-remote-desktop-runtime.ts darwin "$arch"
            bun run verify:remote-desktop-runtime
            bun scripts/install-cua-driver.ts darwin "$arch"
            bun run build
            bunx electron-builder --mac --config.mac.identity=null --config.mac.notarize=false --config apps/desktop/electron-builder.yml
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for f in out/desktop/dist/*.dmg out/desktop/dist/*.zip out/desktop/dist/*.pkg \
                   out/desktop/dist/latest-mac.yml out/desktop/dist/*.blockmap; do
            [ -e "$f" ] && cp "$f" release-assets/
          done
          if [ -f release-assets/latest-mac.yml ]; then mv release-assets/latest-mac.yml release-assets/latest-mac-x64.yml; fi
          (cd release-assets && shasum -a 256 * > SHA256SUMS-macos-x64.txt) || true
          ls -la release-assets || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*)
          if [ ${#files[@]} -eq 0 ]; then echo "No macOS x64 artifacts found"; exit 1; fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  desktop-macos-manifest:
    name: Desktop macOS update manifest
    needs: [desktop-macos-arm64, desktop-macos-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Merge macOS update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manifests
          gh release download "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" \
            --pattern latest-mac-arm64.yml --pattern latest-mac-x64.yml --dir manifests --clobber
          bun scripts/merge-mac-update-manifests.ts \
            manifests/latest-mac-arm64.yml manifests/latest-mac-x64.yml manifests/latest-mac.yml

      - name: Upload merged macOS update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" manifests/latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
