name: Release Mobile iOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to (defaults to the release event tag)
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-mobile-ios-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

jobs:
  ci-gate:
    name: Require green CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a successful CI run
        uses: ./.github/actions/require-green-ci

  meta:
    name: Resolve release metadata
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          pkg_version="$(bun -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
          echo "Package version: $pkg_version"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" --title "${RELEASE_TAG}" --notes "Automated release ${RELEASE_TAG}" --verify-tag
          fi

  mobile-ios:
    name: Mobile iOS
    needs: meta
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer; fi
          xcodebuild -version || true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build iOS IPA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACT: ${{ runner.temp }}/zollybot-ios-${{ needs.meta.outputs.version }}.ipa
          CI: "1"
        shell: bash
        run: |
          set -euo pipefail
          bun run mobile:ios:build:local

      - name: Upload iOS release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/zollybot-ios-${{ needs.meta.outputs.version }}.ipa"
          if [ ! -f "$artifact" ]; then
            echo "iOS artifact not found at $artifact"
            find . -name '*.ipa' | head -20 || true
            exit 1
          fi
          shasum -a 256 "$artifact" > "${artifact}.sha256"
          gh release upload "${RELEASE_TAG}" "$artifact" "${artifact}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
