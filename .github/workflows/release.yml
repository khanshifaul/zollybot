name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to ensure assets exist for (defaults to the release event tag)
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

jobs:
  ci-gate:
    name: Require green CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a successful CI run
        uses: ./.github/actions/require-green-ci

  meta:
    name: Resolve release metadata
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          pkg_version="$(bun -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
          echo "Package version: $pkg_version"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --repo "$GITHUB_REPOSITORY" --title "${RELEASE_TAG}" --notes "Automated release ${RELEASE_TAG}" --verify-tag
          fi
