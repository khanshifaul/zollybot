name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  detect:
    # A pull request runs each lane only when a path the lane reads changed. A path every
    # workspace reads - the lockfile, a shared package, a workflow - runs all of them. A push to
    # main and a manual run always run every lane: `deploy-production` needs them, and a skipped
    # need would skip the deploy.
    #
    # `code` runs for every change except Markdown that no build or test reads: lint and knip cover
    # every workspace. `docs` runs for any Markdown change, so that `Check` still checks its links. `desktop` lists what it skips, not what it reads: the other apps, which the
    # Electron build does not read. `api` also reads the renderer: the Worker bundles its preview
    # and web client.
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.lanes.outputs.code }}
      docs: ${{ steps.lanes.outputs.docs }}
      desktop: ${{ steps.lanes.outputs.desktop }}
      api: ${{ steps.lanes.outputs.api }}
      remote: ${{ steps.lanes.outputs.remote }}
      storybook: ${{ steps.lanes.outputs.storybook }}
      surfaces: ${{ steps.lanes.outputs.surfaces }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit. Its first parent is the base branch, so the
          # two commits hold exactly the changes the pull request brings.
          fetch-depth: 2

      - name: Select lanes
        id: lanes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            changed="package.json"
          else
            # Without `--no-renames`, a moved file lists only its new path, and a move to `docs/`
            # would hide the path that a lane reads.
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          fi
          # Markdown that no build or test reads changes no lane. Not every Markdown file: the API
          # bundles CHANGELOG.md, and the renderer bundles Markdown from `resources/`.
          docs='^((docs|plans|changelog\.d)/.+\.md|(.+/)?AGENTS\.md|(ANALYTICS|CODE_OF_CONDUCT|CONTRIBUTING|PRIVACY|README|SECURITY|SUPPORT)\.md)$'
          all="$changed"
          changed="$(grep -Ev "$docs" <<<"$changed" || true)"
          shared='^(package\.json|bun\.lock|bunfig\.toml|\.nvmrc|biome\.json|tsconfig[^/]*\.json|\.github/|packages/|patches/|tools/|vendor/)'
          lane() {
            if grep -Eq "$shared|$2" <<<"$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          # The inverse, for a lane that reads most of the repository: it runs when a changed path
          # does not match the pattern.
          lane_unless() {
            if grep -Ev "$2" <<<"$changed" | grep -q .; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          lane code '.'
          # Every Markdown file, before the filter above removed some of them.
          if grep -Eq "\.md$|^scripts/check-doc-links\.ts$" <<<"$all" || grep -Eq "$shared" <<<"$changed"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          lane_unless desktop '^(apps/(mobile|site-router|status)|docker|remote)/'
          lane api '^(apps/site-router|src/renderer|resources)/|^(apps/mobile/)?CHANGELOG\.md$'
          lane remote '^(remote|scripts)/'
          lane storybook '^(src|apps/status|\.storybook|resources|marketplace|build)/'
          lane surfaces '^(apps/(mobile|site-router|status)|remote|scripts)/'
          cat "$GITHUB_OUTPUT"

  check:
    # `check:desktop` is this job and `browser` together, in that order. The
    # browser smoke test starts the real Electron binary under xvfb on another
    # Ubuntu runner, so the two run side by side. The install here is the full
    # one: this job builds with electron-vite, which resolves the `electron`
    # package.
    #
    # Branch protection requires this job, and a skipped required check counts as passed. So it
    # runs when `detect` did not succeed, and it skips only when `detect` found no code change and
    # no Markdown change. A Markdown-only change runs only the link check.
    name: Check
    needs: detect
    if: ${{ !cancelled() && (needs.detect.result != 'success' || needs.detect.outputs.code == 'true' || needs.detect.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODE: ${{ needs.detect.result != 'success' || needs.detect.outputs.code == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Check unused files and dependencies
        if: env.CODE == 'true'
        run: bun run knip:check

      - name: Check image asset directories
        if: env.CODE == 'true'
        run: bun run check:assets

      - name: Check Markdown links and anchors
        run: bun run check:doc-links

      - name: Check desktop application
        if: env.CODE == 'true'
        run: bun run check:desktop:static

      - parallel:
          - name: Check translation catalogs
            if: env.CODE == 'true'
            run: bun run i18n:check

          - name: Check ratcheted TypeScript options
            if: env.CODE == 'true'
            run: bun run types:ratchet

          - name: Check agent context budget
            if: env.CODE == 'true'
            run: bun run check:agent-context

  browser:
    # The smoke test starts the real Electron binary and opens windows, so it
    # needs a display. Ubuntu runners have none, so it runs under xvfb, where
    # the queue is shorter and the boot faster than a macOS runner. The install
    # is the default full one: it downloads the Electron binary the test
    # starts, which `development-checks.md` measures as faster than restoring
    # a binary cache.
    name: Browser smoke
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - parallel:
          - name: Set up Bun
            uses: ./.github/actions/setup-bun

          - name: Install a virtual display
            shell: bash
            run: |
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes xvfb

      - name: Run the browser smoke test
        run: xvfb-run -a bun run test:browser

      - name: Run the agent browser session E2E
        run: xvfb-run -a bun run test:browser-agent-session

      - name: Run the browser steps E2E
        run: xvfb-run -a bun run test:browser-steps

      - name: Run the browser dialogs E2E
        run: xvfb-run -a bun run test:browser-dialogs

      - name: Run the browser ambiguous targets E2E
        run: xvfb-run -a bun run test:browser-ambiguous-targets

  tests-desktop:
    # ubuntu-latest gives 4 vCPUs, so vitest runs 3 workers and the job is
    # CPU-bound. The suite is split across shards that run as their own
    # runners. The split is by recorded duration rather than vitest's own file-size one - see
    # tools/vitest/balanced-sequencer.ts for why, and run `bun run
    # test:durations` when the two shards below stop finishing together.
    name: Tests (desktop ${{ matrix.shard }}/2)
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run desktop tests
        run: bun run test:desktop -- --shard=${{ matrix.shard }}/2

  signal-e2e:
    # Starts the real Signal service with throwaway secrets and checks its secret and
    # authentication rules over HTTP and WebSocket. It needs no external service.
    name: Signal E2E
    needs: detect
    if: needs.detect.outputs.remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run the Signal E2E test
        run: bun run test:signal

      - name: Upload the Signal E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signal-security-e2e
          path: .zollybot-build/signal-security-e2e/
          if-no-files-found: ignore

  team-api-routes-e2e:
    # Drives the real Team API server over HTTP on a loopback port, with the real team store and
    # direct-message store on temporary files and an in-memory agent service. It needs no Electron,
    # display or external service.
    name: Team API routes E2E
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run the Team API routes E2E test
        run: bun run test:team-api-routes

      - name: Upload the Team API routes E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: team-api-routes-e2e
          path: .zollybot-build/team-api-routes-e2e/
          if-no-files-found: ignore

  reverse-actions-e2e:
    # Runs the released Team API adapters and the reverse actions (revoke and reconnect, mute and
    # unmute, pause and resume, hide and restore) against the real host services on a temporary
    # profile, with loopback HTTP and WebSocket. It also starts the host stores on settings files that
    # a power loss filled with zeros. It needs no Electron, display or external service.
    name: Team API and reverse actions E2E
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run the Team API legacy clients E2E test
        if: ${{ !cancelled() }}
        run: bun run test:team-legacy-clients

      - name: Run the Team session revoke and reconnect E2E test
        if: ${{ !cancelled() }}
        run: bun run test:team-session-revoke

      - name: Run the sign-in relay paste E2E test
        if: ${{ !cancelled() }}
        run: bun run test:sign-in-relay-paste

      - name: Run the sign-in relay replay E2E test
        if: ${{ !cancelled() }}
        run: bun run test:sign-in-relay-replay

      - name: Run the server mute and unmute E2E test
        if: ${{ !cancelled() }}
        run: bun run test:server-mute

      - name: Run the desktop and phone notification E2E test
        if: ${{ !cancelled() }}
        run: bun run test:desktop-notifications

      - name: Run the phone notification away and Live Activity E2E test
        if: ${{ !cancelled() }}
        run: bun run test:push-notification-away

      - name: Run the computer activity phone notification E2E test
        if: ${{ !cancelled() }}
        run: bun run test:computer-activity

      - name: Run the notification summary E2E test
        if: ${{ !cancelled() }}
        run: bun run test:notification-summary

      - name: Run the routine pause and resume E2E test
        if: ${{ !cancelled() }}
        run: bun run test:routine-pause-resume

      - name: Run the routine time zone move E2E test
        if: ${{ !cancelled() }}
        run: bun run test:routine-timezone-move

      - name: Run the routine overnight window E2E test
        if: ${{ !cancelled() }}
        run: bun run test:routine-overnight-window

      - name: Run the agent open-wait tools E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-waits-tools

      - name: Run the agent hide and restore E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-hide-restore

      - name: Run the messaging pause and resume E2E test
        if: ${{ !cancelled() }}
        run: bun run test:messaging-pause-resume

      - name: Run the Discord role list and reply context E2E test
        if: ${{ !cancelled() }}
        run: bun run test:messaging-discord-access

      - name: Run the turn input E2E test
        if: ${{ !cancelled() }}
        run: bun run test:turn-input

      - name: Run the zero-filled settings file E2E test
        if: ${{ !cancelled() }}
        run: bun run test:zero-filled-settings

      - name: Run the server key rotation E2E test
        if: ${{ !cancelled() }}
        run: bun run test:host-key-rotation

      - name: Run the provider update during a turn E2E test
        if: ${{ !cancelled() }}
        run: bun run test:provider-update-busy

      - name: Run the provider update after an app upgrade E2E test
        if: ${{ !cancelled() }}
        run: bun run test:provider-update-after-app-upgrade

      - name: Run the provider CLI removal E2E test
        if: ${{ !cancelled() }}
        run: bun run test:provider-runtime-remove

      - name: Run the provider session after a process exit E2E test
        if: ${{ !cancelled() }}
        run: bun run test:provider-exit-session

      - name: Run the ACP subagent card E2E test
        if: ${{ !cancelled() }}
        run: bun run test:acp-subagents

      - name: Run the Codex subagent steps E2E test
        if: ${{ !cancelled() }}
        run: bun run test:codex-subagent-steps

      - name: Run the subagent status and failure alert E2E test
        if: ${{ !cancelled() }}
        run: bun run test:subagent-status

      - name: Run the hung Codex app-server E2E test
        if: ${{ !cancelled() }}
        run: bun run test:codex-hung-app-server

      - name: Run the Codex missing rollout backfill E2E test
        if: ${{ !cancelled() }}
        run: bun run test:codex-missing-rollout

      - name: Run the Codex usage metering E2E test
        if: ${{ !cancelled() }}
        run: bun run test:codex-usage-metering

      - name: Run the Codex usage reset E2E test
        if: ${{ !cancelled() }}
        run: bun run test:codex-usage-reset

      - name: Run the usage read pacing E2E test
        if: ${{ !cancelled() }}
        run: bun run test:usage-read-pacing

      - name: Run the routine session E2E test
        if: ${{ !cancelled() }}
        run: bun run test:routine-fresh-session

      - name: Run the routine failure report E2E test
        if: ${{ !cancelled() }}
        run: bun run test:routine-report-failure

      - name: Run the agent webhook routine E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-webhook-routine

      - name: Run the agent channel management E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-channel-manage

      - name: Run the agent channel creation E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-channel-create

      - name: Run the agent workflow gate E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-workflow-gate

      - name: Run the agent profile accounts E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-profile-accounts

      - name: Run the browser profile agents E2E test
        if: ${{ !cancelled() }}
        run: bun run test:browser-profile-agents

      - name: Run the Claude usage after a resume E2E test
        if: ${{ !cancelled() }}
        run: bun run test:claude-usage-resume

      - name: Run the Claude late steer E2E test
        if: ${{ !cancelled() }}
        run: bun run test:claude-late-steer

      - name: Run the provider session reuse E2E test
        if: ${{ !cancelled() }}
        run: bun run test:provider-session-reuse

      - name: Run the backup model failover E2E test
        if: ${{ !cancelled() }}
        run: bun run test:backup-model-failover

      - name: Run the ZIP attachment E2E test
        if: ${{ !cancelled() }}
        run: bun run test:zip-attachments

      - name: Run the MP4 attachment E2E test
        if: ${{ !cancelled() }}
        run: bun run test:mp4-attachments

      - name: Run the SVG attachment E2E test
        if: ${{ !cancelled() }}
        run: bun run test:svg-attachments

      - name: Run the agent MCP server tools E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-mcp-tools

      - name: Run the MCP sign-in client refusal E2E test
        if: ${{ !cancelled() }}
        run: bun run test:mcp-sign-in-client-refused

      - name: Run the unreadable MCP server row E2E test
        if: ${{ !cancelled() }}
        run: bun run test:mcp-server-unreadable-row

      - name: Run the agent bulk settings E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-update-agents

      - name: Run the Gemini usage E2E test
        if: ${{ !cancelled() }}
        run: bun run test:antigravity-usage

      - name: Run the Gemini accounts E2E test
        if: ${{ !cancelled() }}
        run: bun run test:antigravity-accounts

      - name: Run the Gemini usage metering E2E test
        if: ${{ !cancelled() }}
        run: bun run test:antigravity-usage-metering

      - name: Run the workflow model steps E2E test
        if: ${{ !cancelled() }}
        run: bun run test:workflow-model-steps

      - name: Run the workflow Discord E2E test
        if: ${{ !cancelled() }}
        run: bun run test:workflow-discord

      - name: Run the workflow Telegram E2E test
        if: ${{ !cancelled() }}
        run: bun run test:workflow-telegram

      - name: Run the workflow Slack E2E test
        if: ${{ !cancelled() }}
        run: bun run test:workflow-slack

      - name: Run the workflow agent tools E2E test
        if: ${{ !cancelled() }}
        run: bun run test:workflow-agent-tools

      - name: Run the Discord files to GitHub E2E test
        if: ${{ !cancelled() }}
        run: bun run test:discord-github-files

      - name: Run the OpenCode usage metering E2E test
        if: ${{ !cancelled() }}
        run: bun run test:opencode-usage-metering

      - name: Run the Claude API key E2E test
        if: ${{ !cancelled() }}
        run: bun run test:claude-api-key

      - name: Run the Claude stored sign-in E2E test
        if: ${{ !cancelled() }}
        run: bun run test:claude-stored-sign-in

      - name: Run the Cursor usage E2E test
        if: ${{ !cancelled() }}
        run: bun run test:cursor-usage

      - name: Run the OpenCode Go usage E2E test
        if: ${{ !cancelled() }}
        run: bun run test:opencode-go-usage

      - name: Run the Pi sign-in outside ZollyBot E2E test
