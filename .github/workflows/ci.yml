            .zollybot-build/agent-profile-accounts-e2e/
            .zollybot-build/browser-profile-agents-e2e/
            .zollybot-build/claude-usage-resume-e2e/
            .zollybot-build/claude-late-steer-e2e/
            .zollybot-build/provider-session-reuse-e2e/
            .zollybot-build/backup-model-failover-e2e/
            .zollybot-build/zip-attachment-e2e/
            .zollybot-build/mp4-attachment-e2e/
            .zollybot-build/svg-attachment-e2e/
            .zollybot-build/agent-mcp-tools-e2e/
            .zollybot-build/mcp-server-unreadable-row-e2e/
            .zollybot-build/agent-update-agents-e2e/
            .zollybot-build/antigravity-usage-e2e/
            .zollybot-build/antigravity-accounts-e2e/
            .zollybot-build/antigravity-usage-metering-e2e/
            .zollybot-build/workflow-model-steps-e2e/
            .zollybot-build/workflow-discord-e2e/
            .zollybot-build/workflow-telegram-e2e/
            .zollybot-build/workflow-slack-e2e/
            .zollybot-build/workflow-agent-tools-e2e/
            .zollybot-build/discord-github-files-e2e/
            .zollybot-build/opencode-usage-metering-e2e/
            .zollybot-build/claude-api-key-e2e/
            .zollybot-build/claude-stored-sign-in-e2e/
            .zollybot-build/cursor-usage-e2e/
            .zollybot-build/opencode-go-usage-e2e/
            .zollybot-build/pi-sign-in-watch-e2e/
            .zollybot-build/agent-api-keys-e2e/
            .zollybot-build/remote-connect-analytics-e2e/
