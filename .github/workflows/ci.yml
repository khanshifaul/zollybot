            .zollybot-build/computer-activity-e2e/
            .zollybot-build/notification-summary-e2e/
            .zollybot-build/routine-pause-resume-e2e/
            .zollybot-build/routine-timezone-move-e2e/
            .zollybot-build/routine-overnight-window-e2e/
