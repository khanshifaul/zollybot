            .zollybot-build/provider-runtime-remove-e2e/
            .zollybot-build/provider-exit-session-e2e/
            .zollybot-build/acp-subagents-e2e/
            .zollybot-build/codex-subagent-steps-e2e/
            .zollybot-build/subagent-status-e2e/
