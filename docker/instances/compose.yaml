# One ZollyBot container of several on one host. `zollybot-instance` runs it with the env file of the
# instance, so each instance has its own project, container, data and limits. See
# docs/docker.md#several-instances-on-one-host.
services:
  zollybot:
    image: ghcr.io/nightly-labs/zollybot:${ZOLLYBOT_TAG:-latest}
    container_name: zollybot-${ZOLLYBOT_NAME:?}
    restart: unless-stopped
    security_opt:
      - seccomp=../seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    cpus: ${ZOLLYBOT_CPUS:?}
    mem_limit: ${ZOLLYBOT_MEM:?}
    # No swap above the memory limit.
    memswap_limit: ${ZOLLYBOT_MEM:?}
    pids_limit: 8192
    # The soft limit of Docker is 1024 open files, which is too few for Chromium and agent builds.
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    # The container layer is on the disk of the host and has no size limit, so nothing can write to
    # it. ZollyBot and agents write to /data and to these tmpfs folders, which count toward the memory
    # limit.
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=${ZOLLYBOT_TMP:-8g}
      - /var/tmp:exec,mode=1777,size=1g
      - /run/lock:mode=1777,size=1m
      # XDG_RUNTIME_DIR: the control socket, D-Bus and the keyring. Main refuses it unless the image
      # user owns it with mode 0700.
      - /run/zollybot:mode=0700,uid=1000,gid=1000,size=64m
    # The file system of the instance, with its disk limit. ZollyBot only connects out, so the
    # instances publish no port.
    volumes:
      - /srv/zollybot/${ZOLLYBOT_NAME:?}/data:/data
      # Updates from the app: ZollyBot writes requests, and root on the host writes the state. See
      # update-request in zollybot-instance.
      - /srv/zollybot/${ZOLLYBOT_NAME:?}/update-requests:/var/lib/zollybot-update/requests
      - /srv/zollybot/${ZOLLYBOT_NAME:?}/update-status:/var/lib/zollybot-update/status:ro
    # The network of all instances. They cannot reach each other, and zollybot-firewall lets them
    # reach only the internet.
    networks:
      - zollybot
    # rsyslog writes the log to /var/log/zollybot/zollybot-<name>.log, and logrotate keeps 30 days.
    # `docker logs` reads the local cache of Docker. A line longer than 8 KB is cut.
    logging:
      driver: syslog
      options:
        syslog-address: unixgram:///var/lib/zollybot-docker/dev/log
        tag: "{{.Name}}"
        # A slow rsyslog never stops ZollyBot. When the buffer is full, lines are lost.
        mode: non-blocking
        max-buffer-size: 4m

networks:
  zollybot:
    external: true
