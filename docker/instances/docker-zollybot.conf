# Docker starts the ZollyBot containers when it starts. `zollybot-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/zollybot.conf.
[Unit]
# No container starts without its firewall: when zollybot-firewall fails, Docker does not start.
Requires=zollybot-firewall.service
After=zollybot-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
# A container with the LXCFS files of lxcfs.yaml does not start before LXCFS mounts them.
Wants=lxcfs.service
After=lxcfs.service
