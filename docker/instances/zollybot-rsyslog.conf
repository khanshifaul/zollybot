# The container logs of the ZollyBot instances. `zollybot-instance setup` installs it as
# /etc/rsyslog.d/30-zollybot-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. zollybot-logrotate keeps the files for 30 days.
template(name="ZollybotDockerFile" type="string" string="/var/log/zollybot/%programname%.log")
template(name="ZollybotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="zollybot-docker") {
  # The tag is the container name, which zollybot-instance gives.
  if $programname startswith "zollybot-" then {
    # setup makes /var/log/zollybot for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="ZollybotDockerFile" template="ZollybotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/zollybot-docker/dev/log" ruleset="zollybot-docker" createPath="off")
