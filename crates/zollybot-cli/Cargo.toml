[package]
name = "zollybot-cli"
version = "0.62.10"
edition = "2021"
description = "ZollyBot offices from the terminal"
license = "MIT"

[[bin]]
name = "zollybot-cli"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
qrcode = "0.14"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
portable-pty = "0.9"
avt = "0.20"
