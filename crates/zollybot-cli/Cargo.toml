[package]
name = "zollybot-cli"
version = "0.62.0"
edition = "2021"
description = "ZollyBot offices from the terminal"
license = "MIT"

[[bin]]
name = "zollybot-cli"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
